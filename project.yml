name: Hlas
configs:
  Debug: debug
  Release: release
  Distribution: release
options:
  bundleIdPrefix: com.gedeon
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: 74N9VPV9D6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  HlasCore:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/HlasCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gedeon.hlas.core
        SKIP_INSTALL: true
  Hlas:
    type: application
    platform: macOS
    sources:
      - path: Sources/Hlas
      - path: Sources/CWhisper
        excludes: ["include/module.modulemap"]
      - path: Resources/Gradients
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Legal
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.gedeon.hlas
        CFBundleName: Hlas
        CFBundleDisplayName: Hlas
        CFBundleShortVersionString: 0.4.2
        CFBundleVersion: "7"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: Hlas needs the microphone to transcribe your speech.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gedeon.hlas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objc
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CWhisper/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/CWhisper/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/lib
        OTHER_LDFLAGS: >-
          -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lc++
        ARCHS: arm64
      configs:
        Distribution:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "Developer ID Application"
          CODE_SIGN_ENTITLEMENTS: Hlas.entitlements
          ENABLE_HARDENED_RUNTIME: true
          OTHER_CODE_SIGN_FLAGS: "--timestamp"
    dependencies:
      - target: HlasCore
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: AppKit.framework
      - sdk: Security.framework
      - sdk: CoreText.framework
