name: Hlas
options:
  bundleIdPrefix: com.gedeon
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    DEVELOPMENT_TEAM: 74N9VPV9D6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
targets:
  Hlas:
    type: application
    platform: macOS
    sources:
      - path: Sources/Hlas
      - path: Sources/CWhisper
        excludes: ["include/module.modulemap"]
      - path: Resources/Gradients
        buildPhase: resources
      - path: Resources/Fonts
        buildPhase: resources
      - path: Resources/Assets.xcassets
    info:
      path: Info.plist
      properties:
        CFBundleIdentifier: com.gedeon.hlas
        CFBundleName: Hlas
        CFBundleDisplayName: Hlas
        CFBundleShortVersionString: 0.2.0
        CFBundleVersion: "2"
        LSMinimumSystemVersion: "15.0"
        LSUIElement: true
        NSMicrophoneUsageDescription: Hlas needs the microphone to transcribe your speech.
        NSHighResolutionCapable: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gedeon.hlas
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_OBJC_INTEROP_MODE: objc
        SWIFT_INCLUDE_PATHS: $(SRCROOT)/Sources/CWhisper/include
        HEADER_SEARCH_PATHS: $(SRCROOT)/Sources/CWhisper/include
        LIBRARY_SEARCH_PATHS: $(SRCROOT)/Vendor/lib
        OTHER_LDFLAGS: >-
          -lwhisper -lggml -lggml-base -lggml-cpu -lggml-metal -lggml-blas -lc++
        ENABLE_HARDENED_RUNTIME: false
        CODE_SIGN_ENTITLEMENTS: ""
    dependencies:
      - sdk: Metal.framework
      - sdk: Accelerate.framework
      - sdk: AVFoundation.framework
      - sdk: AppKit.framework
      - sdk: Security.framework
      - sdk: CoreText.framework
