name: Windows build

on:
  push:
    branches: [main, master]
    paths: ["windows/**", "Sources/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["windows/**", "Sources/**", ".github/workflows/windows.yml"]
  # One GitHub Release carries both apps. The macOS DMG is built, signed and
  # notarized locally (tools/release.sh) and the release is published from
  # there; publishing triggers this workflow, which attaches the Windows files.
  release:
    types: [published]
  # Re-attach the Windows files to an existing release (e.g. after a CI fix).
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to attach the Windows files to, e.g. v0.5.0"
        required: false

defaults:
  run:
    working-directory: windows

permissions:
  contents: write

jobs:
  core:
    name: Core tests and shared-rule drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
      - name: Format
        run: cargo fmt --check
      - name: Unit tests (platform-independent core)
        run: cargo test --locked
      - name: Clippy (core)
        run: cargo clippy --locked --tests -- -D warnings
      - name: Shared rules match the macOS sources
        run: python3 tools/shared_from_mac.py .. --check

  windows:
    name: Build, test and package
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows

      # whisper-rs-sys builds whisper.cpp (CMake is on the runner) and runs
      # bindgen (needs libclang).
      - name: Install LLVM
        run: choco install llvm --no-progress -y
      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV

      - name: Build (release)
        run: cargo build --release --locked
      - name: Unit tests on Windows
        run: cargo test --release --locked

      # Signing runs only once Azure Artifact Signing is configured
      # (see docs/SIGNING.md). Without it the build is unsigned.
      - name: Azure login (signing)
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Sign hlas.exe
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\target\release
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Install NSIS
        run: choco install nsis --no-progress -y
      - name: Build installer
        working-directory: windows/installer
        run: |
          $metadata = cargo metadata --no-deps --format-version 1 | ConvertFrom-Json
          $version = $metadata.packages[0].version
          & "C:\Program Files (x86)\NSIS\makensis.exe" "/DVERSION=$version" hlas.nsi
      - name: Sign installer
        if: ${{ vars.AZURE_SIGNING_ACCOUNT != '' }}
        uses: azure/artifact-signing-action@v2
        with:
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_CERTIFICATE_PROFILE }}
          files-folder: ${{ github.workspace }}\windows\installer
          files-folder-filter: exe
          files-folder-depth: 1
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: hlas-exe
          path: windows/target/release/hlas.exe
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: hlas-setup
          path: windows/installer/Hlas-setup.exe

      # End-to-end on real Windows. The model is cached between runs.
      - name: Model location
        run: |
          echo "HLAS_DATA=$env:LOCALAPPDATA\Hlas" >> $env:GITHUB_ENV
          echo "HLAS_MODELS=$env:LOCALAPPDATA\Hlas\models" >> $env:GITHUB_ENV
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ${{ env.HLAS_MODELS }}
          key: whisper-large-v3-turbo-q5_0-394221709cd5ad1f
      - name: Download and verify the model with Hlas itself
        run: |
          $p = Start-Process -FilePath target\release\hlas.exe -ArgumentList "--download-model" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "model download failed" }
      - name: Benchmark the local engine
        continue-on-error: true
        timeout-minutes: 20
        run: .github/scripts/bench.ps1
      - name: Transcribe Czech audio locally
        timeout-minutes: 15
        run: .github/scripts/e2e-transcribe.ps1
      - name: Screenshots of every window
        if: ${{ !cancelled() }}
        run: .github/scripts/screenshots.ps1
      - name: Hotkey to Notepad, end to end
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        run: .github/scripts/e2e-hotkey.ps1
      # Last, so a new lint in a newer toolchain never hides the e2e results.
      - name: Clippy (Windows)
        run: cargo clippy --release --locked -- -D warnings

      - name: Collect the app log
        if: always()
        run: |
          New-Item -ItemType Directory -Force -Path screenshots | Out-Null
          Copy-Item "$env:HLAS_DATA\debug.log" screenshots\ -ErrorAction SilentlyContinue
      - name: Upload screenshots and log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots
          path: windows/screenshots/

      # Stable names so README links to releases/latest/download/... never go stale.
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item installer\Hlas-setup.exe Hlas-windows-x64-setup.exe
          Copy-Item target\release\hlas.exe Hlas-windows-x64.exe
          $sums = Get-FileHash Hlas-windows-x64-setup.exe, Hlas-windows-x64.exe -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" }
          Set-Content -Encoding ascii Hlas-windows-SHA256SUMS.txt $sums
          gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" Hlas-windows-x64-setup.exe Hlas-windows-x64.exe Hlas-windows-SHA256SUMS.txt --clobber

  vulkan:
    name: Experimental GPU build (Vulkan)
    runs-on: windows-latest
    continue-on-error: true
    env:
      # whisper.cpp's Vulkan shader generator nests CMake projects deep enough
      # to pass the 260-character path limit under the default target dir.
      CARGO_TARGET_DIR: C:\t
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: vulkan
      - name: Install LLVM
        run: choco install llvm --no-progress -y
      - name: Point bindgen at libclang
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1
        with:
          install_runtime: true
          cache: true
          stripdown: true
      - name: Show Vulkan SDK
        run: |
          Write-Host "VULKAN_SDK=$env:VULKAN_SDK"
          if (-not $env:VULKAN_SDK) { throw "VULKAN_SDK is not set" }
      - name: Build with Vulkan
        run: |
          cargo build --release --locked --features vulkan
          Copy-Item C:\t\release\hlas.exe hlas-vulkan.exe
      - name: Upload GPU build
        uses: actions/upload-artifact@v4
        with:
          name: hlas-vulkan-exe
          path: windows/hlas-vulkan.exe
      - name: Attach to the release
        if: github.event_name == 'release' || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item hlas-vulkan.exe Hlas-windows-x64-vulkan.exe
          gh release upload "${{ github.event.release.tag_name || inputs.release_tag }}" Hlas-windows-x64-vulkan.exe --clobber

  clang:
    name: Local engine built with clang (speed comparison)
    runs-on: windows-latest
    continue-on-error: true
    env:
      # whisper-rs-sys forwards CMAKE_* to whisper.cpp's CMake: build ggml
      # with clang through Ninja instead of MSVC through MSBuild.
      CMAKE_GENERATOR: Ninja
      CMAKE_C_COMPILER: clang-cl
      CMAKE_CXX_COMPILER: clang-cl
      # cmake-rs replaces CMake's default C++ flags; ggml needs exceptions.
      CXXFLAGS: /EHsc
      CARGO_TARGET_DIR: C:\c
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: windows
          key: clang
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Install LLVM and Ninja
        run: choco install llvm ninja --no-progress -y
      - name: Point bindgen at libclang
        run: |
          echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
          echo "C:\Program Files\LLVM\bin" >> $env:GITHUB_PATH
      - name: Build
        run: cargo build --release --locked
      - name: Model location
        run: echo "HLAS_MODELS=$env:LOCALAPPDATA\Hlas\models" >> $env:GITHUB_ENV
      - name: Cache Whisper model
        uses: actions/cache@v4
        with:
          path: ${{ env.HLAS_MODELS }}
          key: whisper-large-v3-turbo-q5_0-394221709cd5ad1f
      - name: Download model
        run: |
          $p = Start-Process -FilePath C:\c\release\hlas.exe -ArgumentList "--download-model" -Wait -PassThru -NoNewWindow
          if ($p.ExitCode -ne 0) { throw "model download failed" }
      - name: Benchmark the local engine
        timeout-minutes: 20
        run: .github/scripts/bench.ps1 -Exe C:\c\release\hlas.exe
      - name: Transcribe Czech audio locally
        timeout-minutes: 15
        run: .github/scripts/e2e-transcribe.ps1 -Exe C:\c\release\hlas.exe
      - name: Upload clang build
        uses: actions/upload-artifact@v4
        with:
          name: hlas-exe-clang
          path: C:\c\release\hlas.exe
